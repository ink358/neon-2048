<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>霓虹2048</title>
<style>
  :root {
    --bg: #08080f;
    --panel: rgba(22, 22, 40, 0.72);
    --grid-line: rgba(120, 140, 255, 0.14);
    --text: #e8ecff;
    --muted: #7d86ad;
    --radius: 14px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -30%;
    background:
      radial-gradient(circle at 18% 22%, rgba(88, 101, 242, 0.22), transparent 46%),
      radial-gradient(circle at 82% 78%, rgba(236, 72, 153, 0.18), transparent 48%),
      radial-gradient(circle at 60% 10%, rgba(34, 211, 238, 0.14), transparent 42%);
    filter: blur(6px);
    animation: drift 26s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes drift {
    from { transform: translate3d(-2%, -1%, 0) scale(1); }
    to   { transform: translate3d(2%, 2%, 0) scale(1.08); }
  }

  .app {
    position: relative;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 22px 16px;
  }

  header {
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }

  .title {
    margin: 0;
    font-size: 30px;
    letter-spacing: 2px;
    font-weight: 800;
    background: linear-gradient(92deg, #6ee7ff, #8b7bff 45%, #ff7ad9);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  .scores { display: flex; gap: 8px; }

  .score-box {
    min-width: 76px;
    padding: 7px 12px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid rgba(130, 150, 255, 0.18);
    text-align: center;
  }

  .score-box span {
    display: block;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--muted);
  }

  .score-box strong {
    font-size: 19px;
    font-variant-numeric: tabular-nums;
  }

  .toolbar {
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .hint { font-size: 12px; color: var(--muted); }

  .buttons { display: flex; gap: 8px; }

  button {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    padding: 9px 16px;
    border-radius: 10px;
    border: 1px solid rgba(140, 160, 255, 0.28);
    background: linear-gradient(180deg, rgba(60, 70, 130, 0.85), rgba(38, 44, 84, 0.85));
    cursor: pointer;
    transition: transform .12s ease, box-shadow .2s ease, opacity .2s ease;
  }

  button:hover { box-shadow: 0 0 18px rgba(110, 130, 255, 0.35); }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

  button.primary {
    border-color: rgba(150, 120, 255, 0.5);
    background: linear-gradient(180deg, rgba(120, 96, 255, 0.95), rgba(78, 58, 190, 0.95));
  }

  .board-wrap {
    position: relative;
    width: min(92vw, 420px);
    aspect-ratio: 1 / 1;
  }

  .board {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    padding: 10px;
    border-radius: var(--radius);
    background: var(--panel);
    border: 1px solid rgba(120, 140, 255, 0.2);
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55), inset 0 0 40px rgba(90, 110, 255, 0.06);
    touch-action: none;
  }

  .cell {
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.035);
    box-shadow: inset 0 0 0 1px var(--grid-line);
  }

  .tile-layer {
    position: absolute;
    inset: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    pointer-events: none;
  }

  .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #0b0b14;
    animation: pop .18s ease;
    background: #2f3556;
  }

  @keyframes pop {
    from { transform: scale(0.72); opacity: 0.4; }
    to   { transform: scale(1); opacity: 1; }
  }

  .tile.merged { animation: merge .22s ease; }
  @keyframes merge {
    0%   { transform: scale(1); }
    55%  { transform: scale(1.14); }
    100% { transform: scale(1); }
  }

  .tile[data-v="2"]    { background: linear-gradient(160deg, #cfe3ff, #9fb6e8); }
  .tile[data-v="4"]    { background: linear-gradient(160deg, #bcd0ff, #8fa2e0); }
  .tile[data-v="8"]    { background: linear-gradient(160deg, #7ee0ff, #37a8e8); }
  .tile[data-v="16"]   { background: linear-gradient(160deg, #7ff0d4, #22b894); }
  .tile[data-v="32"]   { background: linear-gradient(160deg, #c8f57a, #7dc22c); }
  .tile[data-v="64"]   { background: linear-gradient(160deg, #ffe066, #f0a500); }
  .tile[data-v="128"]  { background: linear-gradient(160deg, #ffb066, #f2740c); color: #2a1200; }
  .tile[data-v="256"]  { background: linear-gradient(160deg, #ff8f8f, #e83f3f); color: #2a0000; }
  .tile[data-v="512"]  { background: linear-gradient(160deg, #ff9ee0, #d63bb0); color: #2a0022; }
  .tile[data-v="1024"] { background: linear-gradient(160deg, #c3a6ff, #7b46e8); color: #16002a; }
  .tile[data-v="2048"] { background: linear-gradient(160deg, #fff6a8, #ffcc3d); color: #2b1c00;
                         box-shadow: 0 0 26px rgba(255, 210, 70, 0.65); }
  .tile[data-v="4096"], .tile[data-v="8192"] {
    background: linear-gradient(160deg, #ffffff, #b9c6ff); color: #101024;
    box-shadow: 0 0 26px rgba(190, 205, 255, 0.6);
  }

  /* 位数越多字号越小，避免撑破格子 */
  .tile[data-len="3"] { font-size: 5.6vmin; }
  .tile[data-len="4"] { font-size: 4.6vmin; }
  .tile[data-len="5"] { font-size: 3.6vmin; }

  .tile-layer { font-size: 6.8vmin; }

  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    border-radius: var(--radius);
    background: rgba(8, 8, 18, 0.82);
    backdrop-filter: blur(4px);
    text-align: center;
    padding: 20px;
  }

  .overlay.show { display: flex; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .overlay h2 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 1px;
    background: linear-gradient(92deg, #6ee7ff, #b18bff, #ff7ad9);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .overlay p { margin: 0; font-size: 13px; color: var(--muted); }

  footer { font-size: 11px; color: rgba(125, 134, 173, 0.7); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1 class="title">霓虹2048</h1>
      <p class="subtitle">方向键 / WASD 或滑动合并方块</p>
    </div>
    <div class="scores">
      <div class="score-box"><span>得分</span><strong id="score">0</strong></div>
      <div class="score-box"><span>最高</span><strong id="best">0</strong></div>
    </div>
  </header>

  <div class="toolbar">
    <span class="hint" id="hint">目标：合成 2048</span>
    <div class="buttons">
      <button id="undo" disabled>撤销</button>
      <button id="restart" class="primary">新游戏</button>
    </div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="tile-layer" id="tiles"></div>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">游戏结束</h2>
      <p id="overlay-text"></p>
      <button class="primary" id="overlay-btn">再来一局</button>
    </div>
  </div>

  <footer>进度自动保存在本机浏览器</footer>
</div>

<script>
(function () {
  "use strict";

  var SIZE = 4;
  var STORAGE_KEY = "neon2048.state.v1";

  var boardEl = document.getElementById("board");
  var tilesEl = document.getElementById("tiles");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var hintEl = document.getElementById("hint");
  var undoBtn = document.getElementById("undo");
  var restartBtn = document.getElementById("restart");
  var overlay = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlay-title");
  var overlayText = document.getElementById("overlay-text");
  var overlayBtn = document.getElementById("overlay-btn");

  // 静态底板：一格一个占位，与浮层瓦片共用同一套网格尺寸
  for (var i = 0; i < SIZE * SIZE; i++) {
    var cell = document.createElement("div");
    cell.className = "cell";
    boardEl.appendChild(cell);
  }

  var state = newState();
  var best = 0;
  var previous = null;   // 撤销栈：只保留上一步
  var won = false;
  var busy = false;

  function newState() {
    var grid = [];
    for (var r = 0; r < SIZE; r++) {
      grid.push(new Array(SIZE).fill(0));
    }
    return { grid: grid, score: 0 };
  }

  function emptyCells(grid) {
    var out = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) out.push([r, c]);
      }
    }
    return out;
  }

  function spawn(grid) {
    var cells = emptyCells(grid);
    if (!cells.length) return;
    var pick = cells[Math.floor(Math.random() * cells.length)];
    grid[pick[0]][pick[1]] = Math.random() < 0.9 ? 2 : 4;
  }

  function cloneGrid(grid) {
    return grid.map(function (row) { return row.slice(); });
  }

  /**
   * 把一行向左压缩并合并，返回新行与本次得分。
   * 合并规则：每个方块一步内只参与一次合并。
   */
  function collapseRow(row) {
    var packed = row.filter(function (v) { return v !== 0; });
    var out = [];
    var gained = 0;

    for (var i = 0; i < packed.length; i++) {
      if (i + 1 < packed.length && packed[i] === packed[i + 1]) {
        var merged = packed[i] * 2;
        out.push(merged);
        gained += merged;
        i++;
      } else {
        out.push(packed[i]);
      }
    }

    while (out.length < SIZE) out.push(0);
    return { row: out, gained: gained, merged: out.some(function (v, idx) { return v !== packed[idx]; }) };
  }

  function transpose(grid) {
    var out = newState().grid;
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) out[c][r] = grid[r][c];
    }
    return out;
  }

  function reverseRows(grid) {
    return grid.map(function (row) { return row.slice().reverse(); });
  }

  /**
   * dir: 0=左 1=右 2=上 3=下
   * 统一转成「向左合并」，再转回原方向。
   */
  function move(dir) {
    if (busy) return;
    var snapshot = { grid: cloneGrid(state.grid), score: state.score };

    var work = cloneGrid(state.grid);
    if (dir === 1) work = reverseRows(work);
    if (dir === 2) work = transpose(work);
    if (dir === 3) work = reverseRows(transpose(work));

    var gained = 0;
    var changed = false;
    for (var r = 0; r < SIZE; r++) {
      var before = work[r].join(",");
      var res = collapseRow(work[r]);
      work[r] = res.row;
      gained += res.gained;
      if (work[r].join(",") !== before) changed = true;
    }

    if (!changed) return;

    if (dir === 1) work = reverseRows(work);
    if (dir === 2) work = transpose(work);
    if (dir === 3) work = transpose(reverseRows(work));

    state.grid = work;
    state.score += gained;
    spawn(state.grid);

    previous = snapshot;
    undoBtn.disabled = false;
    render();
    persist();
    checkGameState();
  }

  function canMove() {
    if (emptyCells(state.grid).length) return true;
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var v = state.grid[r][c];
        if (c + 1 < SIZE && state.grid[r][c + 1] === v) return true;
        if (r + 1 < SIZE && state.grid[r + 1][c] === v) return true;
      }
    }
    return false;
  }

  function maxTile() {
    var max = 0;
    state.grid.forEach(function (row) {
      row.forEach(function (v) { if (v > max) max = v; });
    });
    return max;
  }

  function render() {
    tilesEl.innerHTML = "";

    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var v = state.grid[r][c];
        var div = document.createElement("div");
        div.className = "tile";
        if (v === 0) {
          div.style.visibility = "hidden";
        } else {
          div.setAttribute("data-v", String(v));
          div.setAttribute("data-len", String(String(v).length));
          div.textContent = String(v);
        }
        tilesEl.appendChild(div);
      }
    }

    scoreEl.textContent = String(state.score);
    if (state.score > best) {
      best = state.score;
      bestEl.textContent = String(best);
    } else {
      bestEl.textContent = String(best);
    }

    var max = maxTile();
    hintEl.textContent = max >= 2048 ? "已达成 2048，继续冲更高分" : "目标：合成 2048";
  }

  function checkGameState() {
    if (!won && maxTile() >= 2048) {
      won = true;
      showOverlay("达成 2048！", "分数 " + state.score + "，可以继续挑战更大数字。", "继续玩");
      return;
    }
    if (!canMove()) {
      showOverlay("游戏结束", "最终分数 " + state.score + "，没有可合并的方向了。", "再来一局");
    }
  }

  function showOverlay(title, text, btn) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    overlayBtn.textContent = btn;
    overlay.classList.add("show");
  }

  function hideOverlay() {
    overlay.classList.remove("show");
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        grid: state.grid,
        score: state.score,
        best: best,
        won: won
      }));
    } catch (e) { /* 隐私模式下忽略 */ }
  }

  function restore() {
    var raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { return false; }
    if (!raw) return false;
    try {
      var saved = JSON.parse(raw);
      if (!saved || !Array.isArray(saved.grid) || saved.grid.length !== SIZE) return false;
      state.grid = saved.grid.map(function (row) { return row.slice(); });
      state.score = saved.score || 0;
      best = saved.best || 0;
      won = !!saved.won;
      return true;
    } catch (e) { return false; }
  }

  function start() {
    state = newState();
    previous = null;
    won = false;
    undoBtn.disabled = true;
    hideOverlay();
    spawn(state.grid);
    spawn(state.grid);
    render();
    persist();
  }

  function undo() {
    if (!previous) return;
    state.grid = cloneGrid(previous.grid);
    state.score = previous.score;
    previous = null;
    undoBtn.disabled = true;
    hideOverlay();
    render();
    persist();
  }

  // ---- 输入 ----
  var KEYMAP = {
    ArrowLeft: 0, ArrowRight: 1, ArrowUp: 2, ArrowDown: 3,
    a: 0, d: 1, w: 2, s: 3, A: 0, D: 1, W: 2, S: 3,
    h: 0, l: 1, k: 2, j: 3
  };

  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "z" || e.key === "Z") { undo(); return; }
    if (e.key === "r" || e.key === "R") { start(); return; }
    if (overlay.classList.contains("show") && e.key === "Enter") { start(); return; }

    var dir = KEYMAP[e.key];
    if (dir === undefined) return;
    e.preventDefault();
    move(dir);
  }, { passive: false });

  var touchStart = null;

  function onStart(x, y) { touchStart = { x: x, y: y }; }

  function onEnd(x, y) {
    if (!touchStart) return;
    var dx = x - touchStart.x;
    var dy = y - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : 0);
    else move(dy > 0 ? 3 : 2);
  }

  boardEl.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) return;
    onStart(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  boardEl.addEventListener("touchend", function (e) {
    var t = e.changedTouches[0];
    if (!t) return;
    onEnd(t.clientX, t.clientY);
  }, { passive: true });

  boardEl.addEventListener("mousedown", function (e) { onStart(e.clientX, e.clientY); });
  window.addEventListener("mouseup", function (e) { onEnd(e.clientX, e.clientY); });

  undoBtn.addEventListener("click", undo);
  restartBtn.addEventListener("click", start);
  overlayBtn.addEventListener("click", function () {
    if (overlayTitle.textContent.indexOf("达成") === 0) {
      hideOverlay();
    } else {
      start();
    }
  });

  // ---- 启动 ----
  if (restore()) {
    render();
    if (!canMove()) checkGameState();
  } else {
    start();
  }
  bestEl.textContent = String(best);
})();
</script>
</body>
</html>
